# workload_template.yaml
version: 1

description: >
  TorchTitan fine-tuning for Llama 3.1 8B on 4 GPUs with FSDP.
  Profiling configured to capture straggler effects during training.

hf_url: https://huggingface.co/meta-llama/Llama-3.1-8B
trace_url: # To be uploaded to Google Drive or Canvas

workload:
  model:
    phase: training
    moe: false
    granularity: model_fwd_bwd_pass
    model_family: llama-3.1-8b
    precision: bf16
    epochs: 1
    iteration: 3  # Profiled iterations
  data:
    batch_size: 8  # Global batch size (2 per GPU)
    seq_len: 512
    dataset: synthetic  # Dummy text for profiling
  hardware:
    network_topo:
      topology: nvlink
      bandwidth_gbps:
        - 200  # Scale-out
        - 900  # Scale-up NVLink
    xpu_spec:
      type: GPU
      model: nvidia_a100
      total_count: 4
      count_per_node: 4
    driver_version: cuda_12.1

Model-executor:
  framework: 
    name: torchtitan
    compiler_tool_selection: plain_pytorch
  model_plan_parallelization:
    dp_replicate: 1
    dp_shard: 4  # FSDP sharding across 4 GPUs
    tp: 1
    pp: 1
    cp: 1
  communication_library:
    name: NCCL
    version: 2.x
    env:
      NCCL_IB_QPS_PER_CONNECTION:
  protocol_selection:
    - p2p

metric_source:
  traces:
    - kineto_trace
    - torch_et
  metrics_specific_trace:
