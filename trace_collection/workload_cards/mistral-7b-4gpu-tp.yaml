# Workload card for Mistral 7B straggler analysis test
version: 1

description: >
  Simple distributed training test for straggler analysis using Mistral 7B.
  Testing Tensor Parallelism (TP) on Perlmutter with 4 GPUs.

hf_url: /pscratch/sd/k/kg597/llms/mistral-7b-instruct-v0.2
trace_url: # Will be uploaded to Canvas

workload:
  model:
    phase: training
    moe: false
    granularity: model_fwd_bwd_pass
    model_family: mistral-7b
    precision: fp32
    iteration: 10
  data:
    batch_size: 1
    seq_len: 512
    dataset: synthetic
  hardware:
    network_topo:
      topology: nvlink
      bandwidth_gbps:
        - 600
    xpu_spec:
      type: GPU
      model: nvidia_a100
      total_count: 4
      count_per_node: 4
    driver_version: cuda_11.8
  
Model-executor:
  framework: 
    name: pytorch
    compiler_tool_selection: plain_pytorch
  model_plan_parallelization:
    dp_replicate: 1
    dp_shard: 1
    tp: 4
    pp: 1
    cp: 1
  communication_library:
    name: NCCL
    env:
      NCCL_IB_QPS_PER_CONNECTION: 4
      NCCL_DEBUG: INFO
  protocol_selection:
    - nvlink

metric_source:
  traces:
    - nsys
    - kineto_trace
    - torch_et
