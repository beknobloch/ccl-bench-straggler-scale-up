# workload_template.yaml
version: 1

description: >
  vLLM inference for Llama 3.1 8B on 4 GPUs with TP=4.
  Profiling configured to capture straggler effects.

hf_url: https://huggingface.co/meta-llama/Llama-3.1-8B
trace_url: # To be uploaded to Google Drive or Canvas

workload:
  model:
    phase: inference
    moe: false
    granularity: model_fwd
    model_family: llama-3.1-8b
    precision: bf16
    epochs: 1
    iteration: 3  # Profiled iterations
  data:
    batch_size: 2
    seq_len: 512
    dataset: synthetic  # Random prompts
  hardware:
    network_topo:
      topology: nvlink
      bandwidth_gbps:
        - 200  # Scale-out (not used)
        - 900  # Scale-up NVLink
    xpu_spec:
      type: GPU
      model: nvidia_a100  # Adjust to your GPU model
      total_count: 4
      count_per_node: 4
    driver_version: cuda_12.1  # Adjust to your CUDA version

Model-executor:
  framework: 
    name: vllm
    compiler_tool_selection: plain_pytorch
  model_plan_parallelization:
    dp_replicate: 1
    dp_shard: 1
    tp: 4  # Tensor Parallelism
    pp: 1
    cp: 1
  communication_library:
    name: NCCL
    version: 2.x  # Adjust to your NCCL version
    env:
      NCCL_IB_QPS_PER_CONNECTION:
  protocol_selection:
    - p2p  # NVLink for scale-up

metric_source:
  traces:
    - kineto_trace
    - torch_et
  metrics_specific_trace:
