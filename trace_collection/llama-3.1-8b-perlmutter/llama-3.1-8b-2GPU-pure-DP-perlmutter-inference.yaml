# Workload card for LLaMA 3.1 8B inference (single GPU)
version: 1

description: >
  Inference-only workload for LLaMA 3.1 8B on Perlmutter with one A100 GPU.
  Used to collect Kineto and PyTorch Execution Trace for profiling.

hf_url: https://huggingface.co/meta-llama/Llama-3.1-8B
trace_url:

workload:
  model:
    phase: inference
    moe: false
    granularity: model_fwd
    model_family: llama-3.1-8b
    precision: bf16
    iteration: 8
  data:
    batch_size: 2
    seq_len: 1024
    dataset: synthetic
  hardware:
    network_topo:
      topology: nvlink
      bandwidth_gbps:
        - 600
    xpu_spec:
      type: GPU
      model: nvidia_a100
      total_count: 2 # GPU count
      count_per_node: 1
    driver_version: cuda_11.8

Model-executor:
  framework:
    name: pytorch
    compiler_tool_selection: plain_pytorch
  model_plan_parallelization:
    dp_replicate: 2 # copy of model
    dp_shard: 1 # ZeRO
    tp: 1
    pp: 1
    cp: 1
  communication_library:
    name: NCCL
    env:
      NCCL_DEBUG: WARN
  protocol_selection:
    - nvlink

metric_source:
  traces:
    - nsys
    - kineto_trace
    - torch_et
