# Workload card for LLaMA 3.1 8B - 4 GPU Data Parallelism
version: 1

description: >
  LLaMA 3.1 8B training with Data Parallelism (FSDP) across 4 GPUs using TorchTitan.
  Testing straggler effects with data parallel communication patterns.

hf_url: https://huggingface.co/meta-llama/Llama-3.1-8B-Instruct
trace_url: # Will be uploaded

workload:
  model:
    phase: training
    moe: false
    granularity: model_fwd_bwd_pass
    model_family: llama-3.1-8b
    precision: bf16
    iteration: 10
  data:
    batch_size: 2 
    seq_len: 512
    dataset: c4
  hardware:
    network_topo:
      topology: nvlink
      bandwidth_gbps:
        - 600
    xpu_spec:
      type: GPU
      model: nvidia_a100
      total_count: 4 
      count_per_node: 4
    driver_version: cuda_11.8
  
Model-executor:
  framework: 
    name: torchtitan
    compiler_tool_selection: plain_pytorch
  model_plan_parallelization:
    dp_replicate: 1
    dp_shard: 4  # FSDP sharding across 4 GPUs
    tp: 1
    pp: 1
    cp: 1
  communication_library:
    name: NCCL
    env:
      NCCL_IB_QPS_PER_CONNECTION: 4
      NCCL_DEBUG: INFO
  protocol_selection:
    - nvlink

metric_source:
  traces:
    - kineto_trace
    - torch_et
