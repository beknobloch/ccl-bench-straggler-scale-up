# Workload card for LLaMA 3.1 8B straggler analysis test with 2 GPUs
version: 1

description: >
  Simple distributed training test for straggler analysis using LLaMA 3.1 8B-like architecture.
  Testing Data Parallelism (FSDP) on Perlmutter with 2 GPUs to measure straggler effects.
  Using Fully Sharded Data Parallel to fit the model in memory.

hf_url: https://huggingface.co/meta-llama/Llama-3.1-8B-Instruct
trace_url: # Will be uploaded to Canvas

workload:
  model:
    phase: training
    moe: false
    granularity: model_fwd_bwd_pass
    model_family: llama-3.1-8b
    precision: fp32  # Using FP32 for testing (can change to bf16) TODO: change
    iteration: 10  # 10 iterations (5 warmup + 1 profiled + 4 cooldown) TODO: not needed?
  data:
    batch_size: 2 
    seq_len: 512
    dataset: synthetic
  hardware:
    network_topo:
      topology: nvlink
      bandwidth_gbps:
        - 600
    xpu_spec:
      type: GPU
      model: nvidia_a100
      total_count: 2 
      count_per_node: 2
    driver_version: cuda_11.8
  
Model-executor:
  framework: 
    name: pytorch
    compiler_tool_selection: plain_pytorch
  model_plan_parallelization:
    dp_replicate: 1 # Using FSDP for data parallelism
    dp_shard: 2 # FSDP sharding across 2 GPUs
    tp: 1 # No tensor parallelism
    pp: 1 # No pipeline parallelism
    cp: 1 # No context parallelism
  communication_library:
    name: NCCL
    env:
      NCCL_IB_QPS_PER_CONNECTION: 4
      NCCL_DEBUG: INFO
  protocol_selection:
    - nvlink

metric_source:
  traces:
    - nsys
    - kineto_trace
    - torch_et
